[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commonsleepdatapipeline"
version = "1.0.1"
description = "Package for data serving neural networks in automatic sleep staging"
authors = [{ name = "Jesper Strøm", email = "js@ece.au.dk" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.2",
    "scipy~=1.17.1",
    "torch>=2.7.0",
    "h5py~=3.16.0",
    "mne~=1.12.0",
    "lightning~=2.6.1",
    "torchmetrics>=0.11",
    "pandas>=2.1.4",
    "pyarrow~=23.0.1",
    "scikit-learn~=1.8.0",
    "wfdb~=4.3.1",
    "mne-bids>=0.13",
    "xlsxwriter>=3.2",
    "neptune>=1.13",
]

[project.urls]
repository = "https://gitlab.au.dk/tech_ear-eeg/common-sleep-data-pipeline"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["csdp_datastore", "csdp_pipeline", "csdp_training"]
omit = ["*/slurm_scripts/*", "*/tests/*"]
